# Initialize the graphical session synchronously, then start its applications.
# Keeping this as one exec avoids races between environment import and portals.
exec "$SWAY_NOIR_DIR/session/start-session" --idle-lock $idle_lock_timeout --locked-display-off $locked_display_off_timeout "$lock_command" "$audio_settings_command" "$polkit_agent_command" $gammastep_command
