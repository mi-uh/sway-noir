# Initialize the graphical session synchronously, then start its applications.
# Keeping this as one exec avoids races between environment import and portals.
exec "$SWAY_NOIR_DIR/session/start-session" --idle-lock $idle_lock_timeout --locked-display-off $locked_display_off_timeout --lid-ac $lid_ac_action --lid-battery $lid_battery_action "$lock_command" "$audio_settings_command" "$polkit_agent_command" $gammastep_command

# Lid bindings live here so they see the values from 99-local.conf.
bindswitch --locked lid:on exec "$SWAY_NOIR_DIR/session/lid-switch" close $lid_ac_action $lid_battery_action $lock_command
bindswitch --locked lid:off exec "$SWAY_NOIR_DIR/session/lid-switch" open $lid_ac_action $lid_battery_action
