# Manual locking without changing the user's idle or suspend policy.
# Super+l remains available for focusing right.
bindsym $mod+Shift+x exec swaylock --config $SWAY_NOIR_DIR/swaylock/config --image $SWAY_NOIR_DIR/swaylock/cozy-cyberpunk-room-lock.png --scaling fill

# Cycle through workspaces on the focused output with a three-finger swipe.
bindgesture swipe:3:right workspace prev_on_output
bindgesture swipe:3:left workspace next_on_output
