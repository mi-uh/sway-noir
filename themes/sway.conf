# Generated appearance only; shared bindings, inputs and outputs stay separate.
set $bg        {{bg}}
set $surface   {{surface}}
set $muted     {{muted}}
set $border    {{border}}
set $accent    {{accent}}
set $urgent    {{urgent}}
set $text      {{text}}

font pango:{{font}} 10
default_border pixel {{border_width}}
default_floating_border pixel {{border_width}}
hide_edge_borders smart
gaps inner {{gaps_inner}}
gaps outer {{gaps_outer}}
smart_gaps on
smart_borders on

client.focused          $accent  $surface $text  $accent $accent
client.focused_inactive $border  $surface $muted $border $border
client.unfocused        $border  $bg      $muted $border $border
client.urgent           $urgent  $urgent  $text  $urgent $urgent
client.placeholder      $border  $bg      $muted $border $border
client.background       $bg
{{wallpaper_command}}
