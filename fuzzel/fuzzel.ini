[main]
font={{font}}:size=13
dpi-aware=auto
prompt=run: 
layer=overlay
lines=10
width=38
horizontal-pad=24
vertical-pad=12
inner-pad=8
match-mode=fzf
show-actions=yes

[colors]
background={{bg_hex}}f2
text={{text_hex}}ff
prompt={{accent_hex}}ff
input={{input_hex}}ff
match={{urgent_hex}}ff
selection={{selection_hex}}ff
selection-text={{selection_text_hex}}ff
selection-match={{urgent_hex}}ff
counter={{muted_hex}}ff
border={{accent_hex}}ff

[border]
width={{border_width}}
radius={{radius}}
