[main]
font={{font}}:size=13
dpi-aware=auto
prompt="run: "
layer=overlay
anchor=center
lines=7
width=48
horizontal-pad=28
vertical-pad=24
inner-pad=16
icons-enabled=no
match-mode=fzf
show-actions=yes

[colors]
background={{bg_hex}}fc
text={{text_hex}}ff
prompt={{accent_hex}}ff
input={{input_hex}}ff
match={{accent_hex}}ff
selection={{selection_hex}}ff
selection-text={{selection_text_hex}}ff
selection-match={{selection_text_hex}}ff
counter={{muted_hex}}ff
border={{accent_hex}}ff

[border]
width={{border_width}}
radius={{radius}}
