# Start the notification daemon with the Sway Noir configuration.
exec mako --config $SWAY_NOIR_DIR/mako/config

# Make the Sway session available to D-Bus activated user services.
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway

# Optional automatic night color temperature. Install Gammastep, then
# uncomment the following line. See gammastep/config.ini for location settings.
# exec gammastep -c $SWAY_NOIR_DIR/gammastep/config.ini
