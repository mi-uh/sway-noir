[general]
# Mild warmth that matches the Sway Noir palette.
temp-day=6100
temp-night=5600
fade=1
adjustment-method=wayland

# Fixed local times work without location access.
dawn-time=07:00
dusk-time=20:00

# For automatic sunrise and sunset instead, comment out dawn-time and
# dusk-time above, then uncomment the following line:
# location-provider=geoclue2

# If GeoClue is unavailable, a manual provider can be used instead. Keep
# personal coordinates in the installed local profile, not in this repository.
# location-provider=manual
#
# [manual]
# lat=0.0
# lon=0.0
