# Apply the wallpaper and sensible scaling to every connected output.
output * background $SWAY_NOIR_DIR/sway/backgrounds/cozy-cyberpunk-room.png fill #111315
output * scale_filter smart

# Sway detects connected outputs automatically. Use swaymsg -t get_outputs
# and add host-specific placement only when needed, for example:
#
# output eDP-1 mode 1920x1080 position 0 0 scale 1
# output DP-1 mode 2560x1440 position 1920 0 scale 1.25
# workspace 1 output eDP-1
# workspace 6 output DP-1
