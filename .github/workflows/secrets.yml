name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (Node.js 24)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Gitleaks and scan full history and current files
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.0
          archive="gitleaks_${version}_linux_x64.tar.gz"
          tool_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXXXX")"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "$tool_dir/$archive"
          # Update the version and independently verified release checksum together.
          printf '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  %s\n' \
            "$tool_dir/$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$tool_dir/$archive" --directory "$tool_dir" gitleaks
          "$tool_dir/gitleaks" git --log-opts=--all --redact=100 --no-banner --ignore-gitleaks-allow .
          "$tool_dir/gitleaks" dir --redact=100 --no-banner --ignore-gitleaks-allow .
